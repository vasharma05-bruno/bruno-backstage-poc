app:
  title: Scaffolded Backstage App
  baseUrl: http://localhost:3000

  # Enable all packages by default, this will discover packages from packages/app/package.json
  packages: all

  extensions:
    # Configure the catalog index page to be the root page, this is normally mounted on /catalog
    - page:catalog:
        config:
          path: /
    # Both TechDocs entry points ship with no filter, so they show up on `kind:
    # Bruno` pages too, where they are dead weight — a collection's docs are the
    # OpenCollection document on `spec.definition`, and a Bruno entity carries no
    # `backstage.io/techdocs-ref`. Filtering rather than disabling keeps TechDocs
    # everywhere else.
    - entity-content:techdocs:
        config:
          filter:
            $not:
              kind: bruno
    - entity-icon-link:techdocs/read-docs:
        config:
          filter:
            $not:
              kind: bruno

organization:
  name: My Company

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    script-src:
      - "'self'"
      - "'unsafe-eval'"
      - "'unsafe-inline'"
    img-src:
      - "'self'"
      - 'data:'
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  database:
    client: better-sqlite3
    connection: ':memory:'
  # see https://backstage.io/docs/ai/mcp-actions#actions-configuration for more details
  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}

  ### Multi-SCM service credentials. Public repos on gitlab.com /
  ### bitbucket.org need no entry at all, but these blocks are the ONLY way a
  ### PRIVATE repo is readable — the plugin has no per-user read path. See
  ### plugins/bruno-backend/README.md#credential-isolation.
  ###
  ### Never leave a partial entry: Bitbucket Cloud throws at startup for a
  ### `username` with no `token`/`appPassword`, and a blank value is fatal too
  ### (ConfigReader rejects empty strings, failing the whole backend). Comment a
  ### block out rather than emptying its vars.
  # gitlab:
  #   - host: gitlab.com
  #     token: ${GITLAB_TOKEN}
  #   ### Self-hosted GitLab needs apiBaseUrl AND baseUrl:
  #   # - host: gitlab.company.com
  #   #   apiBaseUrl: https://gitlab.company.com/api/v4
  #   #   baseUrl: https://gitlab.company.com
  #   #   token: ${GITLAB_SELF_HOSTED_TOKEN}
  ###
  ### ACTIVE: without this entry a private Bitbucket repo 404s. clientId/
  ### clientSecret use the client_credentials grant, so the reader authenticates
  ### as the OAuth consumer. No `host` key: bitbucket.org is hardcoded for this
  ### integration type and unknown keys error.
  bitbucketCloud:
    - clientId: ${BITBUCKET_CLIENT_ID}
      clientSecret: ${BITBUCKET_CLIENT_SECRET}
      ### Alternative (needs BOTH halves, per the note above):
      # username: ${BITBUCKET_USERNAME}
      # token: ${BITBUCKET_TOKEN}
  ###
  ### Bitbucket Server / Data Center is a different provider
  ### (`integrations.bitbucketServer`) and has no adapter yet: its web URLs carry
  ### the ref in the query string, which the current normalization drops.

proxy:
  ### Example for how to add a proxy endpoint for the frontend.
  ### A typical reason to do this is to handle HTTPS and CORS for internal services.
  # endpoints:
  #   '/test':
  #     target: 'https://example.com'
  #     changeOrigin: true

# Bruno for Backstage — collections ingested as `kind: Bruno` entities, and the
# docs the backend plugin serves for them at /api/bruno/*.
#
# NOTE: every key below must stay under this `bruno:` root key. Without it the
# `schedule` block re-parses as `proxy.schedule` (silently — YAML is happy) and
# the provider falls back to its defaults with zero collections.

bruno:
  collections:
    - type: url
      url: https://github.com/vasharma05-bruno/bruno-collections/tree/main/bruno-testbench
      name: bruno-testbench-collection
      owner: guests
  
  allowRuntimeWrites: true

  # The generated OpenCollection YAML is stored inline on each Bruno entity's
  # `spec.definition`, as a kind: API entity stores its OpenAPI document.
  #
  # It comes from the same pipeline as Bruno's own "Generate docs"
  # (brunoToOpenCollection), which withholds the values of environment variables
  # flagged `secret` and exports everything else verbatim — auth values, headers,
  # bodies and scripts included. A credential hardcoded in a .bru file therefore
  # reaches the catalog, visible to any catalog reader; keep secrets in secret
  # environment variables or as {{placeholders}}.
  definition:
    maxBytes: 1048576
  # Also the upper bound on how long a Sync takes to show new content.
  cacheTtlSeconds: 60
  # Also the latency of the dashboard's add and remove: a collection added from
  # the UI becomes a catalog entity on the next provider tick, and a removed one
  # disappears on the tick after that. Both dialogs quote this number back.
  schedule:
    frequencySeconds: 60
    timeoutSeconds: 30

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'docker' # Alternatives - 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  # see https://backstage.io/docs/auth/ to learn about auth providers
  environment: development
  providers:
    # See https://backstage.io/docs/auth/guest/provider
    guest: {}
    # User login providers for the auth test harness (docs/NEXT-STEPS.md §4).
    # NOTE: `integrations.github` (the ${GITHUB_TOKEN} service PAT above) is a
    # separate thing from this user-login provider — different jobs.
    github:
      development:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        # `repo` is requested at sign-in because the plugin's pull-request flows
        # need write access to the descriptor's repository. It is not used for
        # reading collections — those go through `integrations.github` above.
        # ScmAuth would escalate to `repo` on demand at PR time; asking here
        # keeps the consent out of the flow, where a popup blocker is most
        # likely to bite.
        additionalScopes:
          - repo
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true
    google:
      development:
        clientId: ${AUTH_GOOGLE_CLIENT_ID}
        clientSecret: ${AUTH_GOOGLE_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: emailLocalPartMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true
    gitlab:
      development:
        clientId: ${AUTH_GITLAB_CLIENT_ID}
        clientSecret: ${AUTH_GITLAB_CLIENT_SECRET}
        # Sign-in only. The plugin never asks for a GitLab user token: reads use
        # `integrations.gitlab` server-side and the pull-request flows are
        # GitHub-only, so no repository scope is needed on the OAuth app.
        # Self-hosted GitLab only — must match the instance base URL exactly:
        # audience: https://gitlab.company.com
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true
    # Bitbucket *Cloud* only. Data Center needs the `bitbucketServer` provider
    # plus @backstage/plugin-auth-backend-module-bitbucket-server-provider.
    bitbucket:
      development:
        clientId: ${AUTH_BITBUCKET_CLIENT_ID}
        clientSecret: ${AUTH_BITBUCKET_CLIENT_SECRET}
        # Sign-in only, as for GitLab above: reads use the
        # `integrations.bitbucketCloud` service credential and nothing here
        # writes to Bitbucket, so scmAuth.ts narrows the scopes to `account`.
        signIn:
          resolvers:
            - resolver: userIdMatchingUserEntityAnnotation
              dangerouslyAllowSignInWithoutUserInCatalog: true
  # see https://backstage.io/docs/ai/mcp-actions#client-id-metadata-documents
  # to learn more about client id metadata documents
  clientIdMetadataDocuments:
    enabled: false
    # Optional: restrict which `client_id` URLs are allowed (defaults to ['*'])
    # allowedClientIdPatterns:
    #   - 'https://example.com/*'
    #   - 'https://*.trusted-domain.com/*'
    # Optional: restrict which redirect URIs are allowed (defaults to ['*'])
    # allowedRedirectUriPatterns:
    #   - 'http://localhost:*'
    #   - 'https://*.example.com/*'

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Bruno]
  locations:

    - type: file
      target: ../../catalog-info.yaml

    - type: file
      target: ../../examples/entities.yaml

    - type: url
      target: https://github.com/vasharma05-bruno/bruno-collections/tree/main/bruno-scim-api-collection/scim-collection/catalog-info.yaml
      
    - type: url
      target: https://github.com/vasharma05-bruno/bruno-collections/tree/main/bruno-demo-day-ws/collections/Bruno%20E2E%20Demo/catalog-info.yaml
      
    - type: url
      target: https://github.com/vasharma05-bruno/bruno-collections/tree/main/openapi-sync-ws/collections/Orders%20API/catalog-info.yaml
          
    - type: url
      target: https://github.com/vasharma05-bruno/bruno-collections/tree/main/Webinar-Best-Practices-Feb-2026-BRU/catalog-info.yaml

    - type: url
      target: https://github.com/vasharma05-bruno/bruno-collections/blob/main/github-rest-api-collection/catalog-info.yaml

    - type: file
      target: ../../examples/APIs/demo-apis.yaml
      

    # Local example template
    - type: file
      target: ../../examples/template/template.yaml
      rules:
        - allow: [Template]

    # Local example organizational data
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]

    - type: url
      target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/apis/petstore-api.yaml

kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true

# see https://backstage.io/docs/ai/mcp-actions for more details
mcpActions:
  name: 'My Company Backstage' # defaults to "backstage"
  description: 'Tools for managing your software catalog, creating new services from templates, and exploring your developer portal' # optional
