app:
  title: Scaffolded Backstage App
  baseUrl: http://localhost:3000

  # Enable all packages by default, this will discover packages from packages/app/package.json
  packages: all

  extensions:
    # Configure the catalog index page to be the root page, this is normally mounted on /catalog
    - page:catalog:
        config:
          path: /

organization:
  name: My Company

backend:
  # Used for enabling authentication, secret is shared by all backend plugins
  # See https://backstage.io/docs/auth/service-to-service-auth for
  # information on the format
  # auth:
  #   keys:
  #     - secret: ${BACKEND_SECRET}
  baseUrl: http://localhost:7007
  listen:
    port: 7007
    # Uncomment the following host directive to bind to specific interfaces
    # host: 127.0.0.1
  csp:
    connect-src: ["'self'", 'http:', 'https:']
    script-src:
      - "'self'"
      - "'unsafe-eval'"
      - "'unsafe-inline'"
    img-src:
      - "'self'"
      - 'data:'
    # Content-Security-Policy directives follow the Helmet format: https://helmetjs.github.io/#reference
    # Default Helmet Content-Security-Policy values can be removed by setting the key to false
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  # This is for local development only, it is not recommended to use this in production
  # The production database configuration is stored in app-config.production.yaml
  database:
    client: better-sqlite3
    connection: ':memory:'
  # see https://backstage.io/docs/ai/mcp-actions#actions-configuration for more details
  actions:
    pluginSources:
      - auth
      - catalog
      - scaffolder
  # workingDirectory: /tmp # Use this to configure a working directory for the scaffolder, defaults to the OS temp-dir

integrations:
  github:
    - host: github.com
      # This is a Personal Access Token or PAT from GitHub. You can find out how to generate this token, and more information
      # about setting up the GitHub integration here: https://backstage.io/docs/integrations/github/locations#configuration
      token: ${GITHUB_TOKEN}
    ### Example for how to add your GitHub Enterprise instance using the API:
    # - host: ghe.example.net
    #   apiBaseUrl: https://ghe.example.net/api/v3
    #   token: ${GHE_TOKEN}

  ### Multi-SCM: GitLab and Bitbucket Cloud service credentials.
  ###
  ### NOT required to read PUBLIC repos on gitlab.com / bitbucket.org —
  ### @backstage/integration appends a default entry for all three public hosts,
  ### so the plugin reads them anonymously with no config at all. These blocks
  ### are what a PRIVATE repo needs when the reader should use a shared service
  ### credential rather than each user's own OAuth token.
  ###
  ### Left commented on purpose: a partial entry is worse than none. Bitbucket
  ### Cloud THROWS AT STARTUP for a `username` with no `token`/`appPassword`,
  ### and silently drops a `token` with no `username` — an anonymous read that
  ### looks like a permissions bug. Uncomment only with both halves set.
  # gitlab:
  #   - host: gitlab.com
  #     token: ${GITLAB_TOKEN}
  #   ### Self-hosted GitLab needs apiBaseUrl AND baseUrl:
  #   # - host: gitlab.company.com
  #   #   apiBaseUrl: https://gitlab.company.com/api/v4
  #   #   baseUrl: https://gitlab.company.com
  #   #   token: ${GITLAB_SELF_HOSTED_TOKEN}
  ###
  ### ACTIVE: Bitbucket Cloud is the one host where a private repo has no
  ### user-token fallback at all — `BitbucketCloudUrlReader` ignores a per-call
  ### token, so without this entry a private repo 404s. `clientId`/`clientSecret`
  ### use Bitbucket's client_credentials grant, i.e. the reader authenticates AS
  ### THE OAUTH CONSUMER (the same consumer as `auth.providers.bitbucket` may be
  ### reused). No `host` key here: @backstage/integration hardcodes
  ### bitbucket.org for this integration type and errors on unknown keys.
  ###
  ### A BLANK value is fatal, not ignored: ConfigReader rejects empty-string
  ### ("got empty-string, wanted string"), and since every `core.urlReader`
  ### consumer builds ScmIntegrations at init, that fails the whole backend —
  ### techdocs, catalog, scaffolder and bruno all refuse to start. Comment this
  ### block back out rather than leaving the vars empty.
  bitbucketCloud:
    - clientId: ${BITBUCKET_CLIENT_ID}
      clientSecret: ${BITBUCKET_CLIENT_SECRET}
      ### Alternative (needs BOTH halves, per the note above):
      # username: ${BITBUCKET_USERNAME}
      # token: ${BITBUCKET_TOKEN}
  ###
  ### Bitbucket Server / Data Center is a DIFFERENT provider
  ### (`integrations.bitbucketServer`) and has no adapter yet: its web URLs carry
  ### the ref in the query string, which the current normalization drops.

proxy:
  ### Example for how to add a proxy endpoint for the frontend.
  ### A typical reason to do this is to handle HTTPS and CORS for internal services.
  # endpoints:
  #   '/test':
  #     target: 'https://example.com'
  #     changeOrigin: true
  #
  ### Bruno for Backstage — CORS pass-through for the Collection Docs "Try it out".
  ### The browser calls /api/proxy/<endpoint>/... and Backstage proxies server-side,
  ### avoiding CORS. Host -> endpoint mapping is mirrored in
  ### plugins/bruno/src/lib/proxy.ts (PROXY_HOST_MAP). See docs/POC-DECISIONS.md D4/§6.
  endpoints:
    '/bruno-echo':
      target: 'https://echo.usebruno.com'
      changeOrigin: true
      allowedMethods: ['GET', 'POST', 'PUT', 'DELETE', 'PATCH', 'OPTIONS', 'HEAD']
      allowedHeaders: ['Authorization', 'Content-Type', 'Accept']
    '/bruno-testbench':
      target: 'https://testbench-sanity.usebruno.com'
      changeOrigin: true
      allowedMethods: ['GET', 'POST', 'PUT', 'DELETE', 'PATCH', 'OPTIONS', 'HEAD']
      allowedHeaders: ['Authorization', 'Content-Type', 'Accept']
    '/bruno-example':
      target: 'https://www.example.com'
      changeOrigin: true
      allowedMethods: ['GET', 'POST', 'PUT', 'DELETE', 'PATCH', 'OPTIONS', 'HEAD']
      allowedHeaders: ['Authorization', 'Content-Type', 'Accept']

# Bruno for Backstage — collection sources scanned by BrunoEntityProvider and
# served by the backend plugin at /api/bruno/*. See docs/POC-DECISIONS.md.
#
# NOTE: `sources` must stay under this `bruno:` root key. Without it the
# `schedule` block below re-parses as `proxy.schedule` (silently — YAML is
# happy) and the provider falls back to its defaults with zero sources.
bruno:
  sources: []
    # RISK #1 / Q4 — the private-repo path. Fetched server-side via Backstage's
    # UrlReader using integrations.github creds; the token never reaches the
    # browser. Uncomment and set GITHUB_TOKEN to demo a (public or private) repo:
    # - id: bruno-tests-remote
    #   name: Bruno Tests (GitHub)
    #   type: url
    #   target: https://github.com/usebruno/bruno/tree/main/packages/bruno-tests/collection/echo
  # PRD §"Creating Bruno entities, other than catalog-info.yaml".
  # Each entry becomes a `kind: Bruno` entity emitted by
  # BrunoCollectionEntityProvider. `metadata.name` is derived from the last
  # path segment of `url`; title/version/description come from the
  # collection's bruno.json or opencollection.yml/.yaml.
  collections:
    - type: url
      url: https://github.com/vasharma05-bruno/public-bruno-collection/tree/main/collection
      # `name` override: the default is the URL's last path segment, which here
      # is the generic "collection" (the folder inside the repo). Pinning it
      # keeps the entity ref readable and stable if the folder is ever renamed.
      name: public-bruno-collection
      owner: guests
      # partOf: add API entity refs here to create the collection -> API
      # relation that the Bruno Card on an API page reads, e.g.
      #   partOf:
      #     - api:default/some-api
  # PRD §"Post ingestion" / §"Entity Sync". The generated OpenCollection YAML
  # is stored inline on each Bruno entity's `spec.definition`, mirroring how a
  # kind: API entity stores its OpenAPI document.
  #
  # The document is produced by the same pipeline as Bruno's own "Generate docs"
  # (brunoToOpenCollection), so a collection documented from Backstage matches
  # the one documented from Bruno. That pipeline withholds the values of
  # environment variables flagged `secret` and exports everything else verbatim
  # — including auth values, headers, bodies and scripts. A credential
  # hardcoded in a .bru file therefore reaches the catalog, where any catalog
  # reader can see it; keep secrets in secret environment variables (or as
  # {{placeholders}}) and they stay out of the docs.
  definition:
    maxBytes: 1048576
  # Also the upper bound on how long a Sync takes to show new content.
  cacheTtlSeconds: 60
  schedule:
    frequencySeconds: 60
    timeoutSeconds: 30

# Reference documentation http://backstage.io/docs/features/techdocs/configuration
# Note: After experimenting with basic setup, use CI/CD to generate docs
# and an external cloud storage when deploying TechDocs for production use-case.
# https://backstage.io/docs/features/techdocs/how-to-guides#how-to-migrate-from-techdocs-basic-to-recommended-deployment-approach
techdocs:
  builder: 'local' # Alternatives - 'external'
  generator:
    runIn: 'docker' # Alternatives - 'local'
  publisher:
    type: 'local' # Alternatives - 'googleGcs' or 'awsS3'. Read documentation for using alternatives.

auth:
  # see https://backstage.io/docs/auth/ to learn about auth providers
  environment: development
  providers:
    # See https://backstage.io/docs/auth/guest/provider
    guest: {}
    # User login providers for the auth test harness (docs/NEXT-STEPS.md §4).
    # NOTE: `integrations.github` (the ${GITHUB_TOKEN} service PAT above) is a
    # SEPARATE thing from this user-login provider — different jobs.
    github:
      development:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        # Requested so the plugin can reuse the user's token for private repos.
        additionalScopes:
          - repo
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true
    google:
      development:
        clientId: ${AUTH_GOOGLE_CLIENT_ID}
        clientSecret: ${AUTH_GOOGLE_CLIENT_SECRET}
        signIn:
          resolvers:
            - resolver: emailLocalPartMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true
    gitlab:
      development:
        clientId: ${AUTH_GITLAB_CLIENT_ID}
        clientSecret: ${AUTH_GITLAB_CLIENT_SECRET}
        # The plugin requests `read_user read_api read_repository` on demand via
        # ScmAuth when a private project needs the user's own token. Enable those
        # scopes on the GitLab OAuth application or the consent popup will fail.
        # They are not listed as additionalScopes here so sign-in stays cheap —
        # the escalation happens in the "Connect GitLab" gesture instead.
        # Self-hosted GitLab only — must match the instance base URL exactly:
        # audience: https://gitlab.company.com
        signIn:
          resolvers:
            - resolver: usernameMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true
    # Bitbucket *Cloud* only. Data Center needs the `bitbucketServer` provider
    # plus @backstage/plugin-auth-backend-module-bitbucket-server-provider.
    bitbucket:
      development:
        clientId: ${AUTH_BITBUCKET_CLIENT_ID}
        clientSecret: ${AUTH_BITBUCKET_CLIENT_SECRET}
        # ScmAuth requests `account` on demand — narrowed from the stock
        # `account team pullrequest snippet issue project` in scmAuth.ts, since
        # the plugin cannot use a Bitbucket user token for reads anyway.
        # NOTE: a Bitbucket Cloud user token still cannot read a private repo
        # through this plugin — neither its UrlReader nor its integration config
        # accepts a per-user bearer token, so private Bitbucket needs the
        # `integrations.bitbucketCloud` service credential above. The consent
        # popup is offered for symmetry, but the read falls back with an explicit
        # message saying so. See plugins/bruno-backend/src/scm/bitbucketCloud.ts.
        signIn:
          resolvers:
            - resolver: userIdMatchingUserEntityAnnotation
              dangerouslyAllowSignInWithoutUserInCatalog: true
  # see https://backstage.io/docs/ai/mcp-actions#client-id-metadata-documents
  # to learn more about client id metadata documents
  clientIdMetadataDocuments:
    enabled: false
    # Optional: restrict which `client_id` URLs are allowed (defaults to ['*'])
    # allowedClientIdPatterns:
    #   - 'https://example.com/*'
    #   - 'https://*.trusted-domain.com/*'
    # Optional: restrict which redirect URIs are allowed (defaults to ['*'])
    # allowedRedirectUriPatterns:
    #   - 'http://localhost:*'
    #   - 'https://*.example.com/*'

scaffolder:
  # see https://backstage.io/docs/features/software-templates/configuration for software template options

catalog:
  import:
    entityFilename: catalog-info.yaml
    pullRequestBranchName: backstage-integration
  rules:
    - allow: [Component, System, API, Resource, Location, Bruno]
  locations:
    # Local example data, file locations are relative to the backend process, typically `packages/backend`
    - type: file
      target: ../../examples/entities.yaml

    # Five production Bruno collections from github.com/bruno-collections, each
    # an API entity whose spec.definition is an OpenAPI 3.0.3 document generated
    # from the collection itself. Regenerate with:
    #   node scripts/bruno-catalog/generate.mjs
    - type: file
      target: ../../examples/bruno-collections.yaml

    - type: file
      target: ../../examples/bruno-entity.yaml

    # Sample kind: Bruno entities, one per real collection in
    # github.com/bruno-collections. Spans both collection formats (.bru and
    # opencollection.yml) and both repo-root and subfolder layouts.
    - type: file
      target: ../../examples/bruno-entities.yaml

    # Local example template
    - type: file
      target: ../../examples/template/template.yaml
      rules:
        - allow: [Template]

    # Local example organizational data
    - type: file
      target: ../../examples/org.yaml
      rules:
        - allow: [User, Group]
    
    - type: url
      target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/apis/petstore-api.yaml

    ## Uncomment these lines to add more example data
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/all.yaml

    ## Uncomment these lines to add an example org
    # - type: url
    #   target: https://github.com/backstage/backstage/blob/master/packages/catalog-model/examples/acme-corp.yaml
    #   rules:
    #     - allow: [User, Group]

kubernetes:
  # see https://backstage.io/docs/features/kubernetes/configuration for kubernetes configuration options

# see https://backstage.io/docs/permissions/getting-started for more on the permission framework
permission:
  # setting this to `false` will disable permissions
  enabled: true

# see https://backstage.io/docs/ai/mcp-actions for more details
mcpActions:
  name: 'My Company Backstage' # defaults to "backstage"
  description: 'Tools for managing your software catalog, creating new services from templates, and exploring your developer portal' # optional
