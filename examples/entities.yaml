---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-system
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: examples
spec:
  owner: guests
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-component
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: example-website
spec:
  type: website
  lifecycle: experimental
  owner: guests
  system: examples
  providesApis: [example-grpc-api]
---
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-api
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: example-grpc-api
spec:
  type: grpc
  lifecycle: experimental
  owner: guests
  system: examples
  definition: |
    syntax = "proto3";

    service Exampler {
      rpc Example (ExampleMessage) returns (ExampleMessage) {};
    }

    message ExampleMessage {
      string example = 1;
    };
---
# Unconnected API entity for testing the Bruno runtime-connect flow.
# No usebruno.com annotation -> the Bruno card shows the "Connect" prompt.
# Paste the PUBLIC repo URL below into that field:
#   https://github.com/vasharma05-bruno/public-collection-repo
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: public-collection-repo
  description: >-
    Test target for connecting a public Bruno collection
    (github.com/vasharma05-bruno/public-collection-repo). Not connected.
spec:
  type: openapi
  lifecycle: experimental
  owner: guests
  system: examples
  definition: |
    openapi: 3.0.0
    info: { title: Public Collection Repo, version: '1.0' }
    paths: {}
---
# Unconnected API entity for testing the Bruno runtime-connect flow.
# No usebruno.com annotation -> the Bruno card shows the "Connect" prompt.
# Paste the PRIVATE repo URL below into that field (triggers the GitHub
# OAuth popup for the `repo` scope, since you signed in with Google):
#   https://github.com/vasharma05-bruno/bruno-collection-private
apiVersion: backstage.io/v1alpha1
kind: API
metadata:
  name: private-collection-repo
  description: >-
    Test target for connecting a private Bruno collection
    (github.com/vasharma05-bruno/bruno-collection-private). Not connected.
spec:
  type: openapi
  lifecycle: experimental
  owner: guests
  system: examples
  definition: |
    openapi: 3.0.0
    info: { title: Private Collection Repo, version: '1.0' }
    paths: {}
